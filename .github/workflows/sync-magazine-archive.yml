name: Sync PULSE magazine archive

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-magazine-archive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge latest news feed into magazine archive
        run: node scripts/sync-magazine-archive.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- magazine/archive.json magazine/snapshot.js; then
            echo "No magazine archive changes"
            exit 0
          fi
          git config user.name "aima-magazine-sync"
          git config user.email "actions@users.noreply.github.com"
          git add magazine/archive.json magazine/snapshot.js
          git commit -m "Sync magazine news archive from feed"
          git pull --rebase origin main
          git push origin HEAD:main
